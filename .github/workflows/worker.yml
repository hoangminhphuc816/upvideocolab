name: video-controller

on:
  repository_dispatch:
    types: [video-job]
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy"
        type: choice
        options: [worker, sweep]
        default: worker

# queue: max (GitHub Actions ≥ 2026-05-07): mặc định "single" chỉ giữ 1 run pending và
# HUỶ run pending cũ khi có run mới ⇒ burst tin nhắn làm mất dispatch (job phải chờ sweep 2h).
# max: tối đa 100 run pending, xử lý FIFO. Không dùng chung được với cancel-in-progress: true.
concurrency:
  group: video-worker
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  worker:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'worker')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      WORKER_REPO: ${{ vars.WORKER_REPO }}
      COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cài dependencies + Colab CLI
        run: |
          pip install -r requirements.txt -r requirements-colab.txt
          python tools/check_colab_env.py
      - name: Dispatch job lên Colab VM (worker chạy trên VM)
        run: python -m controller.colab_dispatch

  sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sweep'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      WORKER_REPO: ${{ vars.WORKER_REPO }}
      COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cài dependencies + Colab CLI
        run: |
          pip install -r requirements.txt -r requirements-colab.txt
          python tools/check_colab_env.py
      - name: Sweep job treo (trên runner — chỉ Sheet + notify)
        run: python -m worker.main --sweep
      - name: Xử lý job PENDING/RETRY còn lại (watchdog → Colab VM)
        # Luôn chạy: sweep lỗi không được chặn bước release WAITING.
        if: always()
        run: python -m controller.colab_dispatch
