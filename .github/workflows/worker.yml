name: video-controller

on:
  repository_dispatch:
    types: [video-job]
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy"
        type: choice
        options: [worker, sweep]
        default: worker

concurrency:
  group: video-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'worker')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WORKER_REPO: ${{ vars.WORKER_REPO }}
      COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài dependencies + Colab CLI
        run: |
          pip install -r requirements.txt
          # colab-cli 0.6.0 cần CẢ 'KernelClient' VÀ 'JupyterSubprotocol' từ
          # jupyter_kernel_client — cả hai chỉ tồn tại ở 0.9.0–0.15.0
          # (0.7.x thiếu Subprotocol, 1.0.x bỏ KernelClient). Pin 0.15.0.
          pip install "jupyter-kernel-client==0.15.0" google-colab-cli
      - name: Dispatch job lên Colab VM (worker chạy trên VM)
        run: python -m controller.colab_dispatch

  sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WORKER_REPO: ${{ vars.WORKER_REPO }}
      COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài dependencies + Colab CLI
        run: |
          pip install -r requirements.txt
          # Pin như job worker — colab-cli 0.6.0 cần KernelClient + JupyterSubprotocol (0.15.0)
          pip install "jupyter-kernel-client==0.15.0" google-colab-cli
      - name: Sweep job treo (trên runner — chỉ Sheet + notify)
        run: python -m worker.main --sweep
      - name: Xử lý job PENDING/RETRY còn lại (watchdog → Colab VM)
        run: python -m controller.colab_dispatch
